# Seedream Studio 的 Loader 行。
#
# 配置写在 patch 里（而不是代码里的默认值），这样用户层后续覆写能稳定盖住它，
# 且插件升级不会冲掉用户配置。所有字段都可省略 —— 省略时走代码里的默认值：
#   savePath     默认 $DSH_HOME/seedream-images（不是桌面；可用此项覆盖）
#   defaultModel auto / flash / pro，默认 auto
#   defaultSize  1K / 1.5K / 2K，默认 2K
#   defaultOutputFormat jpeg / png，默认 jpeg
#   historyLimit 内存里保留的生成记录条数，1–200，默认 20
- insert:
    - id: seedream-studio
      name: dsh-seedream-studio